<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>KozenP12</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    background: #1a1a1a;
    font-family: Arial, sans-serif;
    padding-top: 20px;
  }
  .container {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 14px;
    margin-left: 15%; /* Сдвинуто влево примерно на 1 см */
    transform: translateX(-50%);
  }
  .profile-header {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .avatar {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    overflow: hidden;
    background: #333;
    flex-shrink: 0;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .nick-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .nick {
    color: #f0f0f0;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.3px;
  }
  .badge {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    overflow: hidden;
    display: block;
    flex-shrink: 0;
  }
  .badge img { width: 100%; height: 100%; object-fit: cover; display: block; }
  
  /* Увеличенные рамки снизу */
  .info-boxes {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 100%;
  }
  .info-box {
    background: #262626;
    border: 1px solid #3a3a3a;
    border-radius: 8px;
    padding: 12px 16px; /* Увеличены отступы внутри */
    color: #d0d0d0;
    font-size: 15px; /* Увеличен текст */
    display: flex;
    align-items: center;
    gap: 10px;
    white-space: nowrap; /* Чтобы текст не переносился криво */
  }
  .info-box svg {
    width: 20px; /* Увеличены иконки */
    height: 20px;
    fill: #8a8a8a;
    flex-shrink: 0;
  }
  .info-box span {
    color: #f0f0f0;
    font-weight: bold;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="profile-header">
      <div class="avatar">
        <img src="https://p16-common-sign.tiktokcdn.com/tos-alisg-avt-0068/f57aaf7408e03181dce268c8d2e5f7ef~tplv-tiktokx-cropcenter:1080:1080.jpeg?dr=14579&refresh_token=08d70dac&x-expires=1793818800&x-signature=NNXsr6OQ%2BykGBcANYUEJzJGkysQ%3D&t=4d5b0474&ps=13740610&shp=a5d48078&shcp=81f88b70&idc=my2" alt="avatar">
      </div>
      <div class="nick-wrap">
        <div class="nick">KozenP12 Tvink</div>
        <div class="badge">
          <img src="https://s6.iimage.su/s/02/gJa7kQhxjcUgFlq4WRG0b8aHIdiqW4Djg3GDvkGA3.png" alt="badge">
        </div>
      </div>
    </div>
    
    <div class="info-boxes">
      <!-- Верхняя рамка -->
      <div class="info-box">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
        <div>Аккаунт верифицирован компанией <span>"ProstoVerefication"</span></div>
      </div>
      <!-- Нижняя рамка -->
      <div class="info-box">
        <svg viewBox="0 0 24 24"><path d="M18 6h-2c0-2.21-1.79-4-4-4S8 3.79 8 6H6c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-6-2c1.1 0 2 .9 2 2h-4c0-1.1.9-2 2-2zm6 16H6V8h12v12z"/></svg>
        <div>Это бизнес аккаунт <span>(Данные из тикток)</span></div>
      </div>
    </div>
  </div>
</body>
</html>
